name: self-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  self-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}

    steps:
      - name: checkout
        uses: actions/checkout@v4

      # ---- common: fetch pinned binaries via the setup command ----
      - name: setup - fetch pinned binaries (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # Run setup non-interactively by piping "s" then quit when prompted.
          # Then verify the binaries landed.
          echo "s" | bash ./download.sh || true
          if [ ! -x ./yt-dlp ]; then
            echo "setup failed: ./yt-dlp not present after download.sh setup"
            exit 1
          fi
          ./yt-dlp --version

      - name: setup - fetch pinned binaries (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          echo s| download.bat
          if not exist yt-dlp.exe (
            echo setup failed: yt-dlp.exe not present after download.bat setup
            exit /b 1
          )
          yt-dlp.exe --version

      # ---- run self-test non-interactively ----
      - name: self-test (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # Install ffmpeg for the merge step. deno is optional.
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          echo "t" | bash ./download.sh

      - name: self-test (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          echo t| download.bat
