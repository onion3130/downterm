name: self-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  self-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup - fetch pinned binaries (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          bash ./download.sh --setup
          if [ ! -x ./yt-dlp ]; then
            echo "::error::setup failed - ./yt-dlp not present after download.sh --setup"
            exit 1
          fi
          ./yt-dlp --version

      - name: setup - fetch pinned binaries (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          call download.bat --setup
          if not exist yt-dlp.exe (
            echo ::error::setup failed - yt-dlp.exe not present after download.bat --setup
            exit /b 1
          )
          yt-dlp.exe --version

      - name: install ffmpeg (Linux, from system)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg

      - name: self-test (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          NONINTERACTIVE: "1"
        run: |
          # self-test downloads a small stable test file, then deletes it.
          # Pipe stdin that keeps the script happy: 't' starts it, EOF lets it return.
          printf 't\nq\n' | bash ./download.sh || true

      - name: self-test (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          (echo t& echo q) | download.bat || true
