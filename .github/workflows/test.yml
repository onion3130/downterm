name: self-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  self-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup - fetch pinned binaries (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          bash ./download.sh --setup
          if [ ! -x ./yt-dlp ]; then
            echo "::error::setup failed - ./yt-dlp not present after download.sh --setup"
            exit 1
          fi
          ./yt-dlp --version

      - name: setup - fetch pinned binaries (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          call download.bat --setup
          if not exist yt-dlp.exe (
            echo ::error::setup failed - yt-dlp.exe not present after download.bat --setup
            exit /b 1
          )
          yt-dlp.exe --version

      - name: install ffmpeg (Linux, from system)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg

      - name: self-test filter (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # Exercise the download pipeline without the interactive menu.
          chmod +x ./filter.sh
          YT=./yt-dlp
          [ -x "$YT" ] || YT=yt-dlp
          bash ./filter.sh "https://media.w3.org/2010/05/sintel/trailer.mp4" "$(command -v ffmpeg || true)" "$YT" video best "" 0 1 0
          rm -f ./*.mp4 ./*.mkv ./*.webm 2>/dev/null || true

      - name: self-test filter (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $ff = if (Test-Path .\ffmpeg.exe) { '.\ffmpeg.exe' } else { '' }
          & powershell -NoProfile -ExecutionPolicy Bypass -File .\filter.ps1 `
            'https://media.w3.org/2010/05/sintel/trailer.mp4' $ff video best '' 0 1 0
          Get-ChildItem -Include *.mp4,*.mkv,*.webm -File -ErrorAction SilentlyContinue | Remove-Item -Force
